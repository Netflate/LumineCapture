[package]
name = "LumineCapture"
version = "0.1.0"
edition = "2024"

[dependencies]
# async & core Runtime
async-trait = "0.1"
tokio = { version = "1.50.0", features = ["full"] }

# desktop portal
ashpd = { version = "0.13.9", features = ["screencast", "pipewire"] }
pipewire = "0.9.2"

# wayland 
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-cursor = "0.31.14"
wayland-protocols = { version = "0.32", features = ["staging", "wayland-client"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9.3"

# system & os interactions
dirs = "6.0"
memmap2 = "0.9"
nix = { version = "0.31.2", features = ["fs", "process", "poll", "feature"] }
rustix = { version = "1.1.4", features = ["event"] }

# graphics
cosmic-text = "0.19.0"
exr = "1.74.0" 
image = "0.25.10"
resvg = "0.47.0"
tiny-skia = "0.12.0"
usvg = "0.47.0"
zune-core = "0.5.1"
zune-png = "0.5.2"

# utilities
chrono = { version = "0.4", features = ["clock"] }
strum = { version = "0.28", features = ["derive"] }


#[profile.dev]
#opt-level = 1 

#[profile.release]
#lto = true          
#codegen-units = 1   