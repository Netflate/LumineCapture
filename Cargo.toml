[package]
name = "lumine-capture"
version = "0.1.0"
authors = ["Netflate <netflate@gmail.com>"]
edition = "2024"
rust-version = "1.88"
description = "Screenshot and annotation tool for Wayland with built-in OCR"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
# async & core Runtime
async-trait = "0.1"
tokio = { version = "1.50.0", features = ["full"] }
zbus = { version = "5.14.0", features = ["tokio"] }
futures = "0.3"

# desktop portal
ashpd = { version = "0.13.9", features = ["screencast", "pipewire"] }
pipewire = "0.9.2"

# wayland
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["staging", "wayland-client"] }
wl-clipboard-rs = "0.9.3"

# system & os interactions
dirs = "7.0"
nix = { version = "0.31.2", features = ["fs", "process", "poll", "feature", "socket", "signal"] }
rustix = { version = "1.1.4", features = ["event"] }

# graphics
cosmic-text = "0.19.0"
image = "0.25.10"
resvg = "0.48.1"
tiny-skia = "0.12.0"
usvg = "0.48.1"

# ocr - PaddleOCR (PP-OCRv5) via ONNX Runtime; models are downloaded at runtime (ocr/models.rs)
oar-ocr = "0.9"
# not used directly: pins the ort version oar-ocr builds against and enables its WebGPU EP
ort = { version = "=2.0.0-rc.13", features = ["webgpu"], optional = true }
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "optimization"], optional = true }
hmac-sha256 = "1.1"
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }

# utilities
chrono = { version = "0.4", features = ["clock"] }
log = "0.4"
strum = { version = "0.28", features = ["derive"] }
pico-args = { version = "0.5", features = ["combined-flags"] }

# config file
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[features]
default = []
ocr-gpu = ["dep:ort", "dep:lzma-rust2", "oar-ocr/webgpu"]

# drawing and Wayland glue pass many plain values around, and the Stroke::default()
# + field tweaks pattern reads better than a struct literal there
[lints.clippy]
too_many_arguments = "allow"
field_reassign_with_default = "allow"

# optimize dependencies in dev builds too. ONNX Runtime's glue and image
# decode/resize are +-2x slower without it; recompiles of this crate are unaffected.
[profile.dev.package."*"]
opt-level = 3

# cargo build --profile dist. Kept apart from release: full LTO turns a 25 s rebuild into 4 min
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/lumine-capture", dest = "/usr/bin/lumine-capture", mode = "755" },
    { source = "assets/lumine-capture.desktop", dest = "/usr/share/applications/lumine-capture.desktop", mode = "644" },
    { source = "assets/hicolor/16x16/apps/lumine-capture.png", dest = "/usr/share/icons/hicolor/16x16/apps/lumine-capture.png", mode = "644" },
    { source = "assets/hicolor/16x16/apps/lumine-pin.png", dest = "/usr/share/icons/hicolor/16x16/apps/lumine-pin.png", mode = "644" },
    { source = "assets/hicolor/22x22/apps/lumine-capture.png", dest = "/usr/share/icons/hicolor/22x22/apps/lumine-capture.png", mode = "644" },
    { source = "assets/hicolor/22x22/apps/lumine-pin.png", dest = "/usr/share/icons/hicolor/22x22/apps/lumine-pin.png", mode = "644" },
    { source = "assets/hicolor/24x24/apps/lumine-capture.png", dest = "/usr/share/icons/hicolor/24x24/apps/lumine-capture.png", mode = "644" },
    { source = "assets/hicolor/24x24/apps/lumine-pin.png", dest = "/usr/share/icons/hicolor/24x24/apps/lumine-pin.png", mode = "644" },
    { source = "assets/hicolor/32x32/apps/lumine-capture.png", dest = "/usr/share/icons/hicolor/32x32/apps/lumine-capture.png", mode = "644" },
    { source = "assets/hicolor/32x32/apps/lumine-pin.png", dest = "/usr/share/icons/hicolor/32x32/apps/lumine-pin.png", mode = "644" },
    { source = "assets/hicolor/48x48/apps/lumine-capture.png", dest = "/usr/share/icons/hicolor/48x48/apps/lumine-capture.png", mode = "644" },
    { source = "assets/hicolor/48x48/apps/lumine-pin.png", dest = "/usr/share/icons/hicolor/48x48/apps/lumine-pin.png", mode = "644" },
    { source = "assets/hicolor/64x64/apps/lumine-capture.png", dest = "/usr/share/icons/hicolor/64x64/apps/lumine-capture.png", mode = "644" },
    { source = "assets/hicolor/64x64/apps/lumine-pin.png", dest = "/usr/share/icons/hicolor/64x64/apps/lumine-pin.png", mode = "644" },
    { source = "assets/hicolor/128x128/apps/lumine-capture.png", dest = "/usr/share/icons/hicolor/128x128/apps/lumine-capture.png", mode = "644" },
    { source = "assets/hicolor/128x128/apps/lumine-pin.png", dest = "/usr/share/icons/hicolor/128x128/apps/lumine-pin.png", mode = "644" },
    { source = "assets/hicolor/256x256/apps/lumine-capture.png", dest = "/usr/share/icons/hicolor/256x256/apps/lumine-capture.png", mode = "644" },
    { source = "assets/hicolor/256x256/apps/lumine-pin.png", dest = "/usr/share/icons/hicolor/256x256/apps/lumine-pin.png", mode = "644" },
    { source = "assets/hicolor/512x512/apps/lumine-capture.png", dest = "/usr/share/icons/hicolor/512x512/apps/lumine-capture.png", mode = "644" },
    { source = "assets/hicolor/512x512/apps/lumine-pin.png", dest = "/usr/share/icons/hicolor/512x512/apps/lumine-pin.png", mode = "644" },
    { source = "assets/hicolor/scalable/apps/lumine-capture.svg", dest = "/usr/share/icons/hicolor/scalable/apps/lumine-capture.svg", mode = "644" },
    { source = "assets/hicolor/scalable/apps/lumine-pin.svg", dest = "/usr/share/icons/hicolor/scalable/apps/lumine-pin.svg", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/lumine-capture/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/lumine-capture/LICENSE-APACHE", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/lumine-capture/README.md", mode = "644" },
    { source = "docs/lumine-capture-shortcuts-kde.kksrc", dest = "/usr/share/doc/lumine-capture/lumine-capture-shortcuts-kde.kksrc", mode = "644" },
]

[package.metadata.deb]
copyright = "Netflate"
section = "graphics"
priority = "optional"
depends = "$auto"
extended-description = """\
Screenshot and annotation tool for Wayland with built-in OCR. \
Currently captures through KWin, ext-image-copy-capture or the desktop portal."""
