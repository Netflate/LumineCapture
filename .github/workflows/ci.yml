name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ clang pkgconf-pkg-config pipewire-devel libxkbcommon-devel openssl-devel \
            rust cargo clippy rustfmt git
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: fmt, clippy, tests
        run: ./scripts/ci.sh quick
